                            </p>

                        {/* Two pathways */}
                        <div className="grid lg:grid-cols-2 gap-8 mb-12">
                            {/* COST REDUCTION */}
                            <div>
                                <div className="bg-blue-900 text-white px-6 py-4 rounded-t-xl">
                                    <div className="text-xs font-bold uppercase tracking-wider text-blue-200 mb-1">Pathway 1</div>
                                    <h3 className="font-serif text-xl">Cost Reduction</h3>
                                    <p className="text-sm text-blue-100 mt-1">The production floor moves down.</p>
                                </div>
                                <div className="bg-white border border-blue-100 border-t-0 rounded-b-xl divide-y divide-slate-100">
                                    <div className="p-6">
                                        <div className="flex items-start gap-3 mb-2">
                                            <div className="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-700 font-bold text-sm">1</div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">Process improvement</h4>
                                                <p className="text-xs text-slate-500">Industrial engineering on the production process itself.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3 ml-11">
                                            Restructure specialty chemical sourcing, standardise packaging, dedicate machine lines, change indirect cost allocation. The unit cost falls because the production process is redesigned, not because volume rose.
                                        </p>
                                        <div className="ml-11 bg-blue-50 p-3 rounded-lg text-xs text-slate-600 border border-blue-100">
                                            <strong className="text-blue-900">Canonical case:</strong> CHAI's first-generation antiretroviral negotiations from 2003. Dynamic cost analysis under NDA across the full supply chain brought triple-therapy from $500 to under $100 per patient per year, much of it before any volume scale-up materialised.
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex items-start gap-3 mb-2">
                                            <div className="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-700 font-bold text-sm">2</div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">Economies of scale</h4>
                                                <p className="text-xs text-slate-500">Wright's Law and fixed-cost amortisation.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3 ml-11">
                                            Higher volume amortises fixed overhead, raises capacity utilisation, and moves production down the learning curve. The unit cost falls because the same factory makes more units, not because the process changed.
                                        </p>
                                        <div className="ml-11 bg-blue-50 p-3 rounded-lg text-xs text-slate-600 border border-blue-100">
                                            <strong className="text-blue-900">Canonical case:</strong> BASF's Interceptor G2 dual-active-ingredient bed nets. The volume guarantee enabled multi-year capacity investment; manufacturing scale brought unit costs down enough to support a sustainable post-VG price, and the technology now holds roughly 70% of African mosquito-net supply.
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex items-start gap-3 mb-2">
                                            <div className="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 text-blue-700 font-bold text-sm">3</div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">Capital cost reduction</h4>
                                                <p className="text-xs text-slate-500">Lowering the cost of capital as a production input.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3 ml-11">
                                            Capital is an input to production. When concessional debt, first-loss capital, working capital facilities, or microfinance reduce the effective cost of capital for an actor in the supply chain, that input cost flows into the production cost structure the same way process or scale gains do. Instruments that look like financing tools become price-reduction tools when their concessional terms are passed through into the contracted end-price.
                                        </p>
                                        <div className="ml-11 bg-blue-50 p-3 rounded-lg text-xs text-slate-600 border border-blue-100">
                                            <strong className="text-blue-900">Canonical case:</strong> Working capital facilities tied to access commitments. MedAccess and BII have provided below-market-rate working capital to generic manufacturers serving LMICs in exchange for pricing and supply terms; the capital-cost concession is reflected in the contracted ceiling price.
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* MARGIN REDUCTION */}
                            <div>
                                <div className="bg-emerald-700 text-white px-6 py-4 rounded-t-xl">
                                    <div className="text-xs font-bold uppercase tracking-wider text-emerald-200 mb-1">Pathway 2</div>
                                    <h3 className="font-serif text-xl">Margin Reduction</h3>
                                    <p className="text-sm text-emerald-100 mt-1">The supplier captures less of the cost-to-price gap.</p>
                                </div>
                                <div className="bg-white border border-emerald-100 border-t-0 rounded-b-xl divide-y divide-slate-100">
                                    <div className="p-6">
                                        <div className="flex items-start gap-3 mb-2">
                                            <div className="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center flex-shrink-0 text-emerald-700 font-bold text-sm">4</div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">Competition</h4>
                                                <p className="text-xs text-slate-500">Market entry and healthy competitive dynamics.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3 ml-11">
                                            Additional qualified suppliers entering the market force margins down. Sometimes the design intent of an intervention is precisely to make a market attractive enough for a second or third entrant. Price ceilings under which buyers can run competitive tenders are an explicit lever for activating this.
                                        </p>
                                        <div className="ml-11 bg-emerald-50 p-3 rounded-lg text-xs text-slate-600 border border-emerald-100">
                                            <strong className="text-emerald-800">Canonical case:</strong> Dolutegravir-based HIV regimens. The 2017 anchor agreements set a ceiling near $75 per patient per year. As subsequent generic licensees joined the Medicines Patent Pool (eventually around 19), the realised price drifted to $45.
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex items-start gap-3 mb-2">
                                            <div className="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center flex-shrink-0 text-emerald-700 font-bold text-sm">5</div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">Disintermediation</h4>
                                                <p className="text-xs text-slate-500">Removing or restructuring the value stack.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3 ml-11">
                                            Removing layers of distribution that each extract margin, or restructuring how price is composed so that hidden margin becomes visible and contestable. Less clean than the other levers, but real: the same end-to-end transaction can carry materially different total cost depending on how many parties price into it.
                                        </p>
                                        <div className="ml-11 bg-emerald-50 p-3 rounded-lg text-xs text-slate-600 border border-emerald-100">
                                            <strong className="text-emerald-800">Canonical case:</strong> Hologic's per-patient-test viral-load pricing replacing the historic stack of separate machine, reagent, software-upgrade, and maintenance charges. Total cost transparency restructured what buyers could negotiate, and Hologic entered the African market at roughly 35% below incumbent suppliers.
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex items-start gap-3 mb-2">
                                            <div className="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center flex-shrink-0 text-emerald-700 font-bold text-sm">6</div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">Risk transfer</h4>
                                                <p className="text-xs text-slate-500">Absorbing the supplier's uncertainty premium.</p>
                                            </div>
                                        </div>
                                        <p className="text-sm text-slate-600 mb-3 ml-11">
                                            Suppliers facing demand uncertainty, payment uncertainty, or market-existence uncertainty price a premium into their offer. When a third party absorbs that risk via a guarantee, the premium is no longer needed and the supplier reduces price accordingly. Volume guarantees, payment guarantees, and advance market commitments operate primarily through this lever.
                                        </p>
                                        <div className="ml-11 bg-emerald-50 p-3 rounded-lg text-xs text-slate-600 border border-emerald-100">
                                            <strong className="text-emerald-800">Canonical case:</strong> The Gavi pneumococcal AMC. Donors absorbed the market-existence risk for vaccines tailored to LMIC strains; manufacturers committed to a price ceiling and capacity build-out in return. Independent analysis later attributed roughly 67 million additional life-years to the speed differential alone.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Worked example: implants deal */}
                        <div className="bg-white p-8 rounded-xl border border-slate-200 mb-8">
                            <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Worked Example</div>
                            <h3 className="font-serif text-2xl text-slate-900 mb-4">Contraceptive implants, 2013</h3>
                            <p className="text-sm text-slate-600 mb-5">
                                A single intervention rarely runs through one lever. The 2013 implants agreement, which moved unit prices from $18.50 to $8.50 and reached more than 50 million women, ran through at least four levers simultaneously.
                            </p>
                            <div className="grid md:grid-cols-2 gap-4 text-sm">
                                <div className="bg-blue-50 border border-blue-100 p-4 rounded-lg">
                                    <div className="text-xs font-bold uppercase tracking-wider text-blue-900 mb-2">Cost reduction</div>
                                    <ul className="space-y-2 text-slate-700">
                                        <li><strong>Process improvement.</strong> Harmonising five-pack box specifications across previously fragmented packaging requirements increased packaging-line throughput.</li>
                                        <li><strong>Scale.</strong> Six-year volume commitments enabled both manufacturers to invest in capacity and run higher utilisation.</li>
                                    </ul>
                                </div>
                                <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-lg">
                                    <div className="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-2">Margin reduction</div>
                                    <ul className="space-y-2 text-slate-700">
                                        <li><strong>Risk transfer.</strong> The volume guarantees themselves removed the demand uncertainty that had been priced into prior offers.</li>
                                        <li><strong>Competition (delayed).</strong> A third supplier entered in 2017, and post-VG prices have continued to drift downward (to roughly $6.90 in some markets) more than a decade later.</li>
                                    </ul>
                                </div>
                            </div>
                            <p className="text-xs text-slate-500 mt-5 italic">
                                Decomposing the result by lever rather than attributing it to "the volume guarantee" lets you see what each component contributed, which constraints would change the answer, and where a thinner design might have under-delivered.
                            </p>
                        </div>

                        {/* Easy vs hard levers */}
                        <div className="bg-gradient-to-br from-slate-800 to-slate-700 p-6 rounded-xl text-white mb-8">
                            <h4 className="font-semibold mb-4">Easy Levers and Hard Levers</h4>
                            <p className="text-sm text-slate-200 mb-4">
                                The six levers are not equally accessible. Risk transfer and capital cost reduction can be activated through financial-instrument design alone (assuming concessional capital is available). Competition can be activated through market-structure choices like price ceilings and open expression-of-interest processes. Process improvement requires sustained engineering work, NDA-protected access to supplier cost data, and capability that financial actors do not typically have in-house.
                            </p>
                            <p className="text-sm text-slate-200">
                                The result is a structural drift toward the cheap levers. A field that started with cost-side pioneering has narrowed toward risk-transfer-as-default. Risk transfer alone produces a price reduction. It produces a much smaller one than risk transfer combined with process work upstream.
                            </p>
                            <div className="grid md:grid-cols-3 gap-4 mt-5 text-sm">
                                <div className="bg-white/10 p-4 rounded-lg">
                                    <div className="font-medium text-blue-200 mb-2">Cheap and fast</div>
                                    <p className="text-slate-300 text-xs">Risk transfer, pooled procurement, simple price ceilings. Activated through contract design.</p>
                                </div>
                                <div className="bg-white/10 p-4 rounded-lg">
                                    <div className="font-medium text-amber-200 mb-2">Medium</div>
                                    <p className="text-slate-300 text-xs">Scale-driven cost reduction, capital cost reduction, structured competition. Requires multi-year time horizon, credible demand, or concessional capital.</p>
                                </div>
                                <div className="bg-white/10 p-4 rounded-lg">
                                    <div className="font-medium text-emerald-200 mb-2">Slow and capability-intensive</div>
                                    <p className="text-slate-300 text-xs">Process improvement, disintermediation, value-stack restructuring. Requires industrial engineering expertise and supplier trust.</p>
                                </div>
                            </div>
                        </div>

                        {/* Transfer payments and innovation incentives — parallel approaches that sit alongside the mechanism layer */}
                        <div className="bg-white border border-slate-200 rounded-xl p-6 mb-6">
                            <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Parallel Approaches</div>
                            <h4 className="font-semibold text-slate-900 mb-4 text-lg">Transfer Payments and Innovation Incentives</h4>
                            <p className="text-sm text-slate-600 mb-5">
                                Two families of intervention sit alongside the six mechanisms rather than within them. They are widely used, frequently effective, and frequently confused with mechanism-driven price reduction. The difference matters.
                            </p>

                            {/* Transfer payments */}
                            <div className="bg-slate-50 border border-slate-200 rounded-lg p-5 mb-4">
                                <div className="text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Transfer payments</div>
                                <p className="text-sm text-slate-700 mb-3">
                                    A buy-down, a tax credit, a feed-in tariff, or a permanent above-market price guarantee makes a product cheaper for the buyer because someone else pays the difference. The supplier's cost and margin are unchanged. No mechanism in the price-reduction sense has fired. Two sub-cases matter:
                                </p>
                                <div className="grid md:grid-cols-2 gap-4 text-sm">
                                    <div className="bg-white border border-blue-100 rounded-lg p-4">
                                        <div className="text-xs font-bold uppercase tracking-wider text-blue-900 mb-2">Transitional</div>
                                        <p className="text-slate-700 text-sm">
                                            The transfer is a bridge designed to enable a mechanism downstream, typically scale-driven cost reduction or new-entrant competition. Once volume is established or the cost curve has been bought down, the underlying price has genuinely shifted and the transfer can be removed. Early solar feed-in tariffs and parts of the COVID vaccine buy-downs fit this pattern. The instrument is the means; scale or competition is the mechanism.
                                        </p>
                                    </div>
                                    <div className="bg-white border border-emerald-100 rounded-lg p-4">
                                        <div className="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-2">Permanent</div>
                                        <p className="text-slate-700 text-sm">
                                            The transfer sustains a price wedge with no mechanism for the underlying market to converge. Voluntary carbon credits for avoided deforestation work this way: remove the credit and the financial case collapses. There is no durable price reduction; there is an indefinite ongoing transfer. This is appropriate for static Mode 2 problems (externality pricing, permanent compensation for ecosystem services) but is fundamentally different from a mechanism-driven price reduction. Conflating them is a common source of design error.
                                        </p>
                                    </div>
                                </div>
                                <p className="text-xs text-slate-500 mt-4 italic">
                                    The boundary between transitional and permanent is sometimes empirical rather than declared. A carbon credit applied to a Wright's Law cost curve is transitional; the same instrument applied to a static-cost-curve activity is permanent. Knowing which case you are in matters more than what the instrument is called.
                                </p>
                            </div>

                            {/* Innovation incentives */}
                            <div className="bg-slate-50 border border-slate-200 rounded-lg p-5">
                                <div className="text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Innovation incentives</div>
                                <p className="text-sm text-slate-700">
                                    Regulatory incentives (priority review vouchers, exclusivity extensions, fee waivers), innovation prizes, and convertible grants pull innovation forward by making R&D for unmet needs more attractive than it would otherwise be. They cause products to exist. Once those products exist, the mechanism taxonomy applies to whatever price they reach. Innovation incentives are not a seventh lever; they are sequentially prior to the layer this section describes. Designs that use them well typically pair an innovation incentive with a downstream mechanism intervention so that the new product reaches a sustainable access price rather than launching as a high-price niche product.
                                </p>
                            </div>
                        </div>

                        {/* Open questions */}
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-6">
                            <div className="text-xs font-bold uppercase tracking-wider text-amber-800 mb-2">Open Questions</div>
                            <h4 className="font-semibold text-amber-900 mb-3">Edges still being worked out</h4>
                            <ul className="space-y-3 text-sm text-slate-700">
                                <li><strong>Technology and product substitution.</strong> Replacing efavirenz with dolutegravir, or clinic-administered HIV testing with self-tests, changes unit cost at the system level by changing what is being delivered. Whether this is a special case of process improvement (redesign of the production process at the product level) or a distinct phenomenon remains an open call.</li>
                                <li><strong>Disintermediation versus value-stack restructuring.</strong> Removing a distributor layer is genuine margin reduction. Restructuring how a fragmented price stack is composed (for example, the Hologic per-test bundle) does not necessarily reduce supplier margin in aggregate, though it shifts buyer leverage. These may warrant separation rather than being held together as one lever.</li>
                            </ul>
                        </div>
                    </div>
                </section>

                {/* The Instrument DNA - Enhanced with better scaffolding */}
                <section id="anatomy" className="py-16 md:py-24 bg-white scroll-mt-28">
                    <div className="max-w-5xl mx-auto px-6">
                        <div className="text-center mb-8">
                            <h2 className="font-serif text-3xl md:text-4xl text-slate-900 mb-4">The Anatomy of an Instrument</h2>
                            <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                                Every financial instrument—from simple grants to complex impact bonds—is built from the same basic components. Understanding these lets you see through jargon to what any instrument actually does.
                            </p>
                        </div>

                        {/* Framing paragraph */}
                        <div className="bg-white p-6 rounded-xl border border-slate-200 mb-10 max-w-3xl mx-auto">
                            <h3 className="font-semibold text-slate-900 mb-3">Building Blocks of Market Intervention</h3>
                            <p className="text-slate-600 text-sm">
                                There are three fundamental questions that define any intervention. Every instrument is just a set of answers to these questions. When someone mentions a "volume guarantee" or "impact bond" or "concessional loan," you can decode what it actually does by asking: where does it sit on each of these three dimensions?
                            </p>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6 mb-10">
                            {/* Dimension 1: Risk Allocation */}
                            <div className="bg-white p-6 rounded-xl border border-slate-200 card-hover">
                                <div className="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mb-4">
                                    <Icon name="scale" size={24} className="text-blue-700" />
                                </div>
                                <h4 className="font-bold text-lg mb-2 text-slate-900">1. If it fails, who pays?</h4>
                                <p className="text-sm text-slate-600 mb-3">
                                    <em>(Risk Allocation)</em> Who absorbs the loss if the investment doesn't work? At one extreme, the investor loses their money. At the other, a donor or government covers the loss—this is called a <strong>guarantee</strong>.
                                </p>
                                <div className="bg-blue-50 p-3 rounded-lg text-xs text-slate-600">
                                    <strong className="text-blue-800">Why offer a guarantee?</strong> Because some investments are too risky for private capital alone, but too important to abandon. Guarantees shift risk from those who won't bear it to those who can afford to.
                                </div>
                            </div>
                            {/* Dimension 2: Return Expectations */}
                            <div className="bg-white p-6 rounded-xl border border-slate-200 card-hover">
                                <div className="w-12 h-12 bg-emerald-100 rounded-lg flex items-center justify-center mb-4">
                                    <Icon name="layers" size={24} className="text-emerald-700" />
                                </div>
                                <h4 className="font-bold text-lg mb-2 text-slate-900">2. How subsidized is the money?</h4>
                                <p className="text-sm text-slate-600 mb-3">
                                    <em>(Return Expectations)</em> What return does the capital expect? Commercial capital wants market-rate returns (8-15%). Grants expect zero. In between: <strong>concessional capital</strong> accepts below-market returns.
                                </p>
                                <div className="bg-emerald-50 p-3 rounded-lg text-xs text-slate-600">
                                    <strong className="text-emerald-800">Why this matters:</strong> Concessional capital is scarce—it requires someone to accept less return than they could get elsewhere. This is why "staying as commercial as possible" matters.
                                </div>
                            </div>
                            {/* Dimension 3: Payment Trigger */}
                            <div className="bg-white p-6 rounded-xl border border-slate-200 card-hover">
                                <div className="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center mb-4">
                                    <Icon name="target" size={24} className="text-amber-700" />
                                </div>
                                <h4 className="font-bold text-lg mb-2 text-slate-900">3. Pay for effort or results?</h4>
                                <p className="text-sm text-slate-600 mb-3">
                                    <em>(Payment Trigger)</em> Traditional funding pays when you act: hire staff, buy equipment. <strong>Outcome-based funding</strong> pays only when results are verified. Impact bonds are the extreme: investors fund upfront, repaid only if outcomes happen.
                                </p>
                                <div className="bg-amber-50 p-3 rounded-lg text-xs text-slate-600">
                                    <strong className="text-amber-800">The tradeoff:</strong> Outcome-linking creates accountability, but only works when outcomes are measurable and verification is affordable.
                                </div>
                            </div>
                        </div>

                        {/* Spectrums with example instruments */}
                        <div className="bg-white p-8 rounded-xl border border-slate-200 mb-8">
                            <p className="text-sm text-slate-600 mb-8 text-center">
                                Each dimension is a continuous spectrum. Here's where common instruments fall:
                            </p>
                            <SpectrumBar
                                label="1. If it fails, who pays?"
                                question="Who absorbs the loss if things go wrong?"
                                leftLabel="Investor / Borrower"
                                rightLabel="Donor / Taxpayer"
                                gradient="bg-gradient-to-r from-slate-300 to-blue-600"
                                points={[
                                    { position: 10, label: "Commercial loan", color: "#64748b" },
                                    { position: 50, label: "Guarantee", color: "#3b82f6" },
                                    { position: 90, label: "Grant", color: "#1e40af" }
                                ]}
                            />
                            <SpectrumBar
                                label="2. How subsidized is the money?"
                                question="What return does the capital expect?"
                                leftLabel="Full market return"
                                rightLabel="Free (grant)"
                                gradient="bg-gradient-to-r from-slate-700 to-emerald-400"
                                points={[
                                    { position: 10, label: "Equity (15%+)", color: "#1e293b" },
                                    { position: 40, label: "Comm. debt", color: "#475569" },
                                    { position: 70, label: "Concessional", color: "#059669" },
                                    { position: 95, label: "Grant", color: "#10b981" }
                                ]}
                            />
                            <SpectrumBar
                                label="3. Pay for effort or results?"
                                question="When does money flow?"
                                leftLabel="Pay when they act"
                                rightLabel="Pay when we see results"
                                gradient="bg-gradient-to-r from-slate-400 to-amber-500"
                                points={[
                                    { position: 10, label: "Grant / Loan", color: "#64748b" },
                                    { position: 50, label: "Milestone-based", color: "#78716c" },
                                    { position: 90, label: "Impact bond", color: "#d97706" }
                                ]}
                            />
                        </div>

                        <div className="bg-gradient-to-br from-slate-800 to-slate-700 p-6 rounded-xl text-white mb-8">
                            <h4 className="font-semibold mb-4">Design Implications: Each Choice Has a Cost</h4>
                            <div className="grid md:grid-cols-3 gap-4 text-sm">
                                <div className="bg-white/10 p-4 rounded-lg">
                                    <div className="font-medium text-blue-200 mb-2">More risk transfer</div>
                                    <p className="text-slate-300 text-xs">Necessary when the market genuinely can't bear the risk. But it costs the funder more and may weaken market discipline. Absorb only what's necessary.</p>
                                </div>
                                <div className="bg-white/10 p-4 rounded-lg">
                                    <div className="font-medium text-emerald-200 mb-2">More subsidy</div>
                                    <p className="text-slate-300 text-xs">Necessary when deals can't close at commercial rates. But concessional capital is scarce: using less stretches it further. Keep terms as close to market as possible.</p>
                                </div>
                                <div className="bg-white/10 p-4 rounded-lg">
                                    <div className="font-medium text-amber-200 mb-2">More outcome-linkage</div>
                                    <p className="text-slate-300 text-xs">Better accountability and incentive alignment. But verification costs money and not everything is measurable. Use where verification is feasible and cost-effective.</p>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-xl border border-slate-200">
                            <h4 className="font-semibold text-slate-900 mb-3">The Fourth Dimension: Verification</h4>
                            <p className="text-sm text-slate-600 mb-4">
                                Beyond risk, return, and payment triggers lies a question that shapes whether outcome-based approaches are even viable: <strong>how will you know if it's working?</strong>
                            </p>
                            <div className="grid md:grid-cols-2 gap-4 text-sm">
                                <div className="bg-slate-50 p-4 rounded-lg">
                                    <div className="font-medium text-slate-800 mb-2">What makes verification feasible?</div>
                                    <ul className="text-slate-600 space-y-1 text-xs">
                                        <li>• Outcomes are clearly defined and measurable</li>
                                        <li>• Attribution is possible (was it the intervention?)</li>
                                        <li>• Verification costs are proportionate to deal size</li>
                                        <li>• Timeframes allow for outcome observation</li>
                                    </ul>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg">

        const GLOSSARY_TERMS = [
            { term: "Financial Landscape", definition: "A conceptual map where elevation represents profitability—lower elevations indicate more profitable opportunities. Capital flows predictably toward these low points, following the path of greatest financial return regardless of social value." },
            { term: "Social Landscape", definition: "A conceptual map where elevation represents social value—lower elevations indicate greater benefit to society. The central challenge of impact finance is that this landscape often differs significantly from the financial landscape." },
            { term: "Transitional Access Gap", definition: "A market condition where profitable and socially beneficial outcomes align, but capital fails to flow due to temporary barriers: unproven markets, perceived risk, coordination failures, or information asymmetries. These situations typically respond to time-limited interventions that can eventually be withdrawn." },
            { term: "Structural Misalignment", definition: "A market condition where private incentives systematically diverge from social benefit—as with pollution externalities or products that serve wealthy markets while remaining inaccessible to lower-income populations. These situations require permanent interventions that reshape the underlying incentive structure." },
            { term: "Local Minimum", definition: "In landscape metaphor: a suboptimal equilibrium where capital has settled despite superior alternatives existing elsewhere. Capital remains trapped because reaching the better outcome requires crossing a barrier of risk or uncertainty that individual actors are unwilling to bear." },
            { term: "Global Minimum", definition: "In landscape metaphor: the optimal equilibrium where both financial returns and social value are maximized. Well-functioning markets naturally direct capital here; intervention aims to achieve this alignment where markets alone cannot." },
            { term: "Terraforming", definition: "Permanently restructuring the economic landscape so that profitable activities become socially beneficial, or vice versa. Carbon taxes exemplify this by making pollution costly; subsidies do so by making clean alternatives economically competitive." },
            { term: "Catalyst", definition: "The operational entity responsible for executing a financial instrument. Financial structures require ongoing management: negotiating terms, monitoring performance, resolving disputes, and coordinating stakeholders. Even well-designed instruments fail without capable catalysts." },
            { term: "Risk Allocation", definition: "The distribution of potential losses across stakeholders. In commercial transactions, investors bear losses; grants transfer this risk to donors; guarantees shift risk from private investors to public or philanthropic entities willing to absorb it." },
            { term: "Return Expectations", definition: "The financial returns capital providers require. Commercial investors typically demand market-rate returns (8-15%); philanthropic capital may accept zero financial return; concessional capital occupies the spectrum between these extremes." },
            { term: "Payment Trigger", definition: "The conditions that release funding. Traditional financing pays upon activity completion; results-based financing pays upon verified outcome achievement. The choice between these approaches involves tradeoffs between accountability, measurability, and risk allocation." },
            { term: "Additionality", definition: "The criterion that an intervention must cause outcomes that would not have occurred otherwise. Interventions lacking additionality merely substitute public resources for private investment without generating incremental impact." },
            { term: "Crowding Out", definition: "The displacement of private investment by public or philanthropic capital. When interventions fund outcomes that private capital would have financed anyway, the net effect is a reallocation of who pays rather than an increase in beneficial activity." },
            { term: "Exit Strategy", definition: "The planned conclusion of an intervention. For transitional problems, exit involves leaving behind self-sustaining markets; for structural problems, interventions may require indefinite continuation or transition to permanent policy mechanisms." },
            { term: "Principle of Precision", definition: "The guideline to deploy the minimum intervention necessary to achieve desired outcomes. Over-subsidizing wastes scarce concessional resources and risks market distortion; under-subsidizing renders interventions ineffective." },
            { term: "Volume Guarantee", definition: "A binding commitment to purchase specified quantities if market demand falls short. By assuring a minimum sales volume, this instrument enables suppliers to invest in production capacity with reduced demand risk." },
            { term: "Advance Market Commitment (AMC)", definition: "A binding commitment to purchase products meeting specified criteria at guaranteed prices, typically for innovations that do not yet exist. AMCs create incentives for R&D investment in products serving markets that would otherwise be commercially unviable." },
            { term: "First-Loss Capital", definition: "Capital positioned to absorb initial losses before other investors are affected. By protecting senior investors from downside risk, first-loss capital can catalyze commercial investment in opportunities otherwise deemed too risky." },
            { term: "Results-Based Financing (RBF)", definition: "Financing mechanisms that link payments to verified outcomes rather than inputs or activities. This approach shifts accountability toward results but requires measurable outcomes and cost-effective verification systems." },
            { term: "Development Impact Bond (DIB)", definition: "A structure where private investors provide upfront capital for social programs; outcome funders (typically governments or donors) repay investors with returns contingent on independently verified achievement of predetermined outcomes." },
            { term: "Carbon Tax", definition: "A levy on greenhouse gas emissions that internalizes the external cost of climate damage into market prices, making carbon-intensive activities proportionally more expensive relative to lower-emission alternatives." },
            { term: "Cap-and-Trade", definition: "A market-based emissions control system where regulators set aggregate emission limits and issue tradable permits. Emitters must hold permits for their emissions, creating a market price for pollution and enabling least-cost abatement." },
            { term: "Carbon Credits", definition: "Tradable certificates representing verified emission reductions or removals, typically measured in tons of CO2 equivalent. Credits create revenue streams for emission-reducing activities and enable entities to offset their own emissions." },
            { term: "Blended Finance", definition: "The strategic combination of public/philanthropic capital with private investment to enable transactions that neither could achieve independently. Public capital typically absorbs risk or accepts concessional returns to mobilize larger volumes of private capital." },
            { term: "Concessional Capital", definition: "Capital provided at terms more favorable than prevailing market rates—whether through lower interest, longer tenors, higher risk tolerance, or more flexible conditions. The difference between concessional and market terms represents an implicit subsidy." },
            { term: "Externality", definition: "A cost or benefit arising from an economic activity that affects parties not directly involved in the transaction. Negative externalities (pollution, disease transmission) impose uncompensated costs; positive externalities (education, vaccination) generate uncompensated benefits." },
            { term: "Coordination Failure", definition: "A market failure where mutually beneficial collective action fails to occur because individual actors cannot coordinate or commit simultaneously. Classic examples include supplier investment that awaits buyer commitments, and vice versa." },
            { term: "Market Shaping", definition: "A diagnostic discipline for redirecting private capital toward outcomes markets won't deliver on their own. Rather than a single technique, market shaping requires understanding why capital isn't flowing, then choosing interventions that match the specific market failure. The term originated in global health but describes the same challenge addressed by 'blended finance' (development) and 'carbon finance' (climate)." },
            { term: "Static Misalignment", definition: "A form of structural misalignment where cost exceeds willingness/ability to pay, and no foreseeable trend (technology curve, scale economy) will naturally close that gap. Examples include rural last-mile vaccine logistics and orphan disease treatments. Requires permanent intervention such as ongoing subsidies or public provision." },
            { term: "Converging Misalignment", definition: "A form of structural misalignment where the market is currently misaligned, but cost curves are declining (Wright's Law) or value is rising, such that the gap will eventually close. Examples include solar PV in 2008 and green hydrogen today. Requires accelerant interventions (volume guarantees, AMCs) to 'buy down' the cost curve faster." },
            { term: "Bridge to Nowhere", definition: "The error of treating static misalignment as though it were converging. You launch a pilot, prove the intervention works technically, then watch it collapse when funding ends—because the underlying economics never changed and never will." },
            { term: "Deadweight Loss (Intervention)", definition: "The error of treating converging misalignment as though it were static. You lock in permanent subsidies for technology that would have become economically viable anyway, effectively paying for outcomes that market forces would have delivered—wasting scarce philanthropic or public resources." }
        ].sort((a, b) => a.term.localeCompare(b.term));
