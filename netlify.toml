[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# frame-src allows app.netlify.com so the Netlify Drawer (the review toolbar Netlify injects into Deploy Previews)
# can load; without it the Drawer shows as a broken grey frame at the bottom of preview pages. Production deploys
# do not get the Drawer, and the site itself embeds no frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' https://app.netlify.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
